<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .code-highlight { background: #fef08a; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">邮箱管理系统</h1>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <!-- 左侧：邮箱列表 -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow p-4">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-lg font-semibold">邮箱账号</h2>
                        <button onclick="showAddModal()" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">添加</button>
                    </div>
                    <div id="accountList" class="space-y-2"></div>
                </div>
                <!-- 别名管理 -->
                <div id="aliasSection" class="bg-white rounded-lg shadow p-4 mt-4 hidden">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-semibold">别名管理</h2>
                        <div class="flex gap-1">
                            <button onclick="showAllMail()" class="bg-gray-500 text-white px-2 py-1 rounded text-xs hover:bg-gray-600">全部邮件</button>
                            <button onclick="generateAlias()" class="bg-purple-500 text-white px-2 py-1 rounded text-xs hover:bg-purple-600">生成别名</button>
                        </div>
                    </div>
                    <div class="mb-2">
                        <div class="flex gap-1">
                            <input id="aliasTagInput" type="text" placeholder="自定义tag（留空随机）" class="flex-1 border rounded px-2 py-1 text-xs">
                            <button onclick="generateAliasWithTag()" class="border px-2 py-1 rounded text-xs hover:bg-gray-50">添加</button>
                        </div>
                    </div>
                    <div id="aliasList" class="space-y-1 max-h-48 overflow-auto"></div>
                </div>
            </div>
            <!-- 右侧：邮件列表 -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow p-4">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-lg font-semibold" id="mailTitle">选择邮箱查看邮件</h2>
                        <button onclick="refreshMail()" id="refreshBtn" class="bg-green-500 text-white px-3 py-1 rounded text-sm hover:bg-green-600 hidden">刷新</button>
                    </div>
                    <div id="mailList" class="space-y-2">
                        <p class="text-gray-400 text-center py-8">点击左侧邮箱查看邮件</p>
                    </div>
                    <!-- 分页 -->
                    <div id="pagination" class="flex items-center justify-between mt-4 hidden">
                        <span id="pageInfo" class="text-sm text-gray-500"></span>
                        <div class="flex gap-2">
                            <button onclick="prevPage()" id="prevBtn" class="px-3 py-1 border rounded text-sm hover:bg-gray-50 disabled:opacity-50" disabled>上一页</button>
                            <button onclick="nextPage()" id="nextBtn" class="px-3 py-1 border rounded text-sm hover:bg-gray-50 disabled:opacity-50" disabled>下一页</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加/编辑弹窗 -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md mx-4">
            <h3 id="modalTitle" class="text-lg font-semibold mb-4">添加邮箱</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm text-gray-600 mb-1">快速导入（邮箱----密码----client_id----refresh_token）</label>
                    <textarea id="rawInput" rows="3" class="w-full border rounded px-3 py-2 text-sm" placeholder="粘贴完整凭据字符串..."></textarea>
                </div>
                <div class="text-center text-gray-400 text-sm">— 或手动填写 —</div>
                <input id="inputEmail" type="text" placeholder="邮箱" class="w-full border rounded px-3 py-2 text-sm">
                <input id="inputPassword" type="text" placeholder="密码（可选）" class="w-full border rounded px-3 py-2 text-sm">
                <input id="inputClientId" type="text" placeholder="Client ID" class="w-full border rounded px-3 py-2 text-sm">
                <textarea id="inputToken" rows="2" placeholder="Refresh Token" class="w-full border rounded px-3 py-2 text-sm"></textarea>
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button onclick="closeModal()" class="px-4 py-2 border rounded text-sm hover:bg-gray-50">取消</button>
                <button onclick="saveAccount()" class="px-4 py-2 bg-blue-500 text-white rounded text-sm hover:bg-blue-600">保存</button>
            </div>
        </div>
    </div>

    <!-- 邮件详情弹窗 -->
    <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg w-full max-w-3xl mx-4 max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-start">
                <div class="flex-1 min-w-0">
                    <h3 id="detailSubject" class="text-lg font-semibold truncate"></h3>
                    <div class="text-sm text-gray-500 mt-1">
                        <span id="detailFrom"></span> → <span id="detailTo"></span>
                    </div>
                    <div class="text-xs text-gray-400 mt-1" id="detailDate"></div>
                    <div id="detailCodes" class="mt-2"></div>
                </div>
                <button onclick="closeDetail()" class="text-gray-400 hover:text-gray-600 text-2xl ml-4">&times;</button>
            </div>
            <div id="detailBody" class="p-4 overflow-auto flex-1"></div>
        </div>
    </div>
<!-- PLACEHOLDER_SCRIPT -->
    <script>
    let currentAccountId = null;
    let editingId = null;
    let currentPage = 1;
    let totalPages = 1;
    let filterTo = null;

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadAccounts() {
        const resp = await fetch('/api/accounts');
        const accounts = await resp.json();
        const el = document.getElementById('accountList');
        if (!accounts.length) {
            el.innerHTML = '<p class="text-gray-400 text-center py-4">暂无邮箱</p>';
            return;
        }
        el.innerHTML = accounts.map(a => `
            <div class="flex items-center justify-between p-2 rounded border ${currentAccountId === a.id ? 'border-blue-500 bg-blue-50' : 'hover:bg-gray-50'} cursor-pointer" onclick="selectAccount(${a.id}, '${a.email}')">
                <span class="text-sm truncate flex-1">${a.email}</span>
                <div class="flex gap-1 ml-2">
                    <button onclick="event.stopPropagation();editAccount(${a.id})" class="text-gray-400 hover:text-blue-500 text-xs">编辑</button>
                    <button onclick="event.stopPropagation();removeAccount(${a.id})" class="text-gray-400 hover:text-red-500 text-xs">删除</button>
                </div>
            </div>
        `).join('');
    }

    async function selectAccount(id, email) {
        currentAccountId = id;
        currentPage = 1;
        filterTo = email;
        document.getElementById('mailTitle').textContent = email;
        document.getElementById('refreshBtn').classList.remove('hidden');
        document.getElementById('aliasSection').classList.remove('hidden');
        loadAccounts();
        loadMessages(id, 1);
        loadAliases(id);
    }

    async function loadAliases(id) {
        const resp = await fetch(`/api/accounts/${id}/aliases`);
        const aliases = await resp.json();
        const el = document.getElementById('aliasList');
        if (!aliases.length) {
            el.innerHTML = '<p class="text-gray-400 text-xs text-center py-2">暂无别名</p>';
            return;
        }
        el.innerHTML = aliases.map(a => `
            <div class="flex items-center justify-between p-1 rounded border text-xs ${filterTo === a.alias ? 'border-purple-500 bg-purple-50' : ''}">
                <span class="truncate flex-1 cursor-pointer hover:text-purple-500" onclick="filterByAlias('${a.alias}')" title="点击查看该别名邮件">${a.alias}</span>
                <button onclick="event.stopPropagation();copyAlias('${a.alias}')" class="text-gray-400 hover:text-blue-500 ml-1 text-[10px]">复制</button>
                <button onclick="event.stopPropagation();removeAlias(${a.id})" class="text-gray-400 hover:text-red-500 ml-1">×</button>
            </div>
        `).join('');
    }

    async function generateAlias() {
        if (!currentAccountId) return;
        const resp = await fetch(`/api/accounts/${currentAccountId}/aliases`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({}) });
        const data = await resp.json();
        if (data.error) { alert(data.error); return; }
        loadAliases(currentAccountId);
    }

    async function generateAliasWithTag() {
        if (!currentAccountId) return;
        const tag = document.getElementById('aliasTagInput').value.trim();
        const resp = await fetch(`/api/accounts/${currentAccountId}/aliases`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({tag}) });
        const data = await resp.json();
        if (data.error) { alert(data.error); return; }
        document.getElementById('aliasTagInput').value = '';
        loadAliases(currentAccountId);
    }

    async function removeAlias(id) {
        await fetch(`/api/aliases/${id}`, { method: 'DELETE' });
        loadAliases(currentAccountId);
    }

    function copyAlias(alias) {
        navigator.clipboard.writeText(alias);
    }

    function filterByAlias(alias) {
        filterTo = alias;
        currentPage = 1;
        document.getElementById('mailTitle').textContent = alias;
        loadMessages(currentAccountId, 1);
        loadAliases(currentAccountId);
    }

    function showAllMail() {
        filterTo = null;
        currentPage = 1;
        document.getElementById('mailTitle').textContent = '全部邮件';
        loadMessages(currentAccountId, 1);
        loadAliases(currentAccountId);
    }

    async function loadMessages(id, page) {
        const el = document.getElementById('mailList');
        el.innerHTML = '<p class="text-gray-400 text-center py-8">加载中...</p>';
        const resp = await fetch(`/api/accounts/${id}/messages?page=${page}&per_page=20${filterTo ? '&filter_to='+encodeURIComponent(filterTo) : ''}`);
        const data = await resp.json();
        if (data.error) {
            el.innerHTML = `<p class="text-red-500 text-center py-8">${data.error}</p>`;
            document.getElementById('pagination').classList.add('hidden');
            return;
        }
        if (!data.messages.length) {
            el.innerHTML = '<p class="text-gray-400 text-center py-8">没有邮件</p>';
            document.getElementById('pagination').classList.add('hidden');
            return;
        }
        totalPages = data.total_pages;
        currentPage = data.page;
        el.innerHTML = data.messages.map(m => {
            const codesHtml = m.codes.length ? `<div class="mt-1">${m.codes.map(c => `<span class="code-highlight">${c}</span>`).join(' ')}</div>` : '';
            const preview = escapeHtml(m.body_preview);
            return `
            <div class="p-3 border rounded hover:bg-gray-50 cursor-pointer" onclick="viewMessage('${m.uid}')">
                <div class="flex justify-between items-start">
                    <div class="font-medium text-sm truncate flex-1">${escapeHtml(m.subject) || '(无主题)'}</div>
                    ${m.codes.length ? '<span class="text-xs bg-yellow-200 px-2 py-0.5 rounded ml-2 whitespace-nowrap">验证码</span>' : ''}
                </div>
                <div class="text-xs text-gray-500 mt-1">${escapeHtml(m.from)}</div>
                <div class="text-xs text-gray-400">${m.date}</div>
                ${codesHtml}
                <div class="text-xs text-gray-600 mt-1 line-clamp-2">${preview}</div>
            </div>`;
        }).join('');

        // 更新分页
        const pagination = document.getElementById('pagination');
        pagination.classList.remove('hidden');
        document.getElementById('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 页（共 ${data.total} 封）`;
        document.getElementById('prevBtn').disabled = currentPage <= 1;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function prevPage() { if (currentPage > 1) loadMessages(currentAccountId, currentPage - 1); }
    function nextPage() { if (currentPage < totalPages) loadMessages(currentAccountId, currentPage + 1); }
    function refreshMail() { if (currentAccountId) loadMessages(currentAccountId, currentPage); }

    async function viewMessage(uid) {
        document.getElementById('detailModal').classList.remove('hidden');
        document.getElementById('detailBody').innerHTML = '<p class="text-gray-400 text-center py-8">加载中...</p>';
        document.getElementById('detailSubject').textContent = '';
        document.getElementById('detailFrom').textContent = '';
        document.getElementById('detailTo').textContent = '';
        document.getElementById('detailDate').textContent = '';
        document.getElementById('detailCodes').innerHTML = '';

        const resp = await fetch(`/api/accounts/${currentAccountId}/messages/${uid}`);
        const data = await resp.json();
        if (data.error) {
            document.getElementById('detailBody').innerHTML = `<p class="text-red-500">${data.error}</p>`;
            return;
        }
        document.getElementById('detailSubject').textContent = data.subject || '(无主题)';
        document.getElementById('detailFrom').textContent = data.from;
        document.getElementById('detailTo').textContent = data.to;
        document.getElementById('detailDate').textContent = data.date;
        if (data.codes.length) {
            document.getElementById('detailCodes').innerHTML = data.codes.map(c => `<span class="code-highlight">${c}</span>`).join(' ');
        }
        if (data.is_html) {
            const iframe = document.createElement('iframe');
            iframe.classList.add('w-full', 'border-0');
            iframe.style.height = '500px';
            iframe.srcdoc = data.body;
            document.getElementById('detailBody').innerHTML = '';
            document.getElementById('detailBody').appendChild(iframe);
        } else {
            document.getElementById('detailBody').innerHTML = `<pre class="whitespace-pre-wrap text-sm">${data.body}</pre>`;
        }
    }

    function closeDetail() { document.getElementById('detailModal').classList.add('hidden'); }

    function showAddModal() {
        editingId = null;
        document.getElementById('modalTitle').textContent = '添加邮箱';
        document.getElementById('rawInput').value = '';
        document.getElementById('inputEmail').value = '';
        document.getElementById('inputPassword').value = '';
        document.getElementById('inputClientId').value = '';
        document.getElementById('inputToken').value = '';
        document.getElementById('modal').classList.remove('hidden');
    }

    async function editAccount(id) {
        const resp = await fetch('/api/accounts');
        const accounts = await resp.json();
        const account = accounts.find(a => a.id === id);
        if (!account) return;
        editingId = id;
        document.getElementById('modalTitle').textContent = '编辑邮箱';
        document.getElementById('rawInput').value = '';
        document.getElementById('inputEmail').value = account.email || '';
        document.getElementById('inputPassword').value = '';
        document.getElementById('inputClientId').value = '';
        document.getElementById('inputToken').value = '';
        document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('modal').classList.add('hidden'); }

    async function saveAccount() {
        const raw = document.getElementById('rawInput').value.trim();
        let body;
        if (raw) {
            body = { raw };
        } else {
            body = {
                email: document.getElementById('inputEmail').value.trim(),
                password: document.getElementById('inputPassword').value.trim(),
                client_id: document.getElementById('inputClientId').value.trim(),
                refresh_token: document.getElementById('inputToken').value.trim(),
            };
        }
        const url = editingId ? `/api/accounts/${editingId}` : '/api/accounts';
        const method = editingId ? 'PUT' : 'POST';
        const resp = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
        const data = await resp.json();
        if (data.error) { alert(data.error); return; }
        closeModal();
        loadAccounts();
    }

    async function removeAccount(id) {
        if (!confirm('确定删除？')) return;
        await fetch(`/api/accounts/${id}`, { method: 'DELETE' });
        if (currentAccountId === id) {
            currentAccountId = null;
            document.getElementById('mailTitle').textContent = '选择邮箱查看邮件';
            document.getElementById('mailList').innerHTML = '<p class="text-gray-400 text-center py-8">点击左侧邮箱查看邮件</p>';
            document.getElementById('refreshBtn').classList.add('hidden');
            document.getElementById('pagination').classList.add('hidden');
        }
        loadAccounts();
    }

    loadAccounts();
    </script>
</body>
</html>
