<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow p-8 w-full max-w-sm">
        <h1 class="text-xl font-bold text-center mb-6">管理员登录</h1>
        {% if error %}
        <p class="text-red-500 text-sm text-center mb-4">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/admin/login">
            <input type="password" name="password" placeholder="请输入管理密码" class="w-full border rounded px-4 py-2 mb-4" autofocus>
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">登录</button>
        </form>
    </div>
</body>
</html>
